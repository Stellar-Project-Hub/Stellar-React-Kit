name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: echo "Typecheck pending contributor implementation"

      - name: Lint
        run: echo "Linting pending contributor implementation"

      - name: Format check
        run: echo "Formatting check pending contributor implementation"

      - name: Test
        run: npm test
